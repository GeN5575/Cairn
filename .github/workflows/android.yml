name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build the APK from the zip
        run: |
          unzip -q cairn-android.zip -d project
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../cairn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-apk
          path: cairn.apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cairn.apk \
            --title "Cairn (APK)" \
            --notes "Dernière version du jeu, prête à installer sur Android." \
            --target "${GITHUB_SHA}"
